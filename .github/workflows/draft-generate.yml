name: Generate Drafts

on:
  schedule:
    - cron: "7 0,3,6,9,12 * * *"  # KST 09/12/15/18/21시+7분, 정각 혼잡 회피

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run generate_drafts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GENERATE_MAX_PER_RUN: "2"  # GitHub cron 드롭으로 실행 횟수 부족해질 때 1건씩 못 따라잡는 문제 보정
        run: python generate_drafts.py

      - name: Show log
        if: always()
        run: tail -n 30 app.log || true

      - name: Commit state
        run: |
          git config user.name "blog-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts.db config.json
          git diff --staged --quiet || git commit -m "chore: draft state update"
          git pull --rebase
          git push
